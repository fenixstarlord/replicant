{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · Replicant</title>
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
<meta name="theme-color" content="#0b0c10">
<link rel="stylesheet" href="/static/app.css?v={{.Version}}">
<script src="/static/htmx.min.js?v={{.Version}}" defer></script>
</head>
<body class="min-h-screen bg-base-200">
<header class="bg-base-100 border-b border-base-300">
  <nav class="navbar max-w-screen-2xl mx-auto px-4 flex-wrap gap-y-1">
    <div class="flex flex-wrap items-center gap-x-1">
      <a href="/drives" class="btn btn-ghost text-lg font-semibold px-2">Replicant</a>
      <a href="/drives" class="btn btn-ghost btn-sm {{if eq .Path "/drives"}}btn-active{{end}}">Drives</a>
      <a href="/search" class="btn btn-ghost btn-sm {{if eq .Path "/search"}}btn-active{{end}}">Search</a>
      <a href="/history" class="btn btn-ghost btn-sm {{if eq .Path "/history"}}btn-active{{end}}">History</a>
      {{if not .Open}}<a href="/settings/api-keys" class="btn btn-ghost btn-sm {{if eq .Path "/settings/api-keys"}}btn-active{{end}}">API keys</a>{{end}}
      <a href="/settings" class="btn btn-ghost btn-sm {{if eq .Path "/settings"}}btn-active{{end}}">Settings</a>
    </div>
    <div class="ml-auto flex items-center gap-2">
      <form method="get" action="/search" class="hidden md:block">
        <input type="search" name="q" placeholder="Find a clip or file…" class="input input-bordered input-sm w-64" aria-label="Search">
      </form>
      {{if and .Identity.Auth (not .Open)}}<form method="post" action="/logout"><button class="btn btn-ghost btn-sm">Log out</button></form>{{end}}
    </div>
  </nav>
</header>
<main class="max-w-screen-2xl mx-auto p-4 md:p-6 pb-16">
{{block "content" .}}{{end}}
</main>
<footer class="statusbar fixed bottom-0 inset-x-0 bg-base-100 border-t border-base-300 text-sm">
  <div class="max-w-screen-2xl mx-auto px-4 py-1.5 flex items-center gap-3 min-h-9">
    <a href="/history" id="statusbar" class="flex-1 min-w-0 truncate link-hover" hx-get="/history/bar" hx-trigger="load, every 3s" hx-swap="innerHTML" title="Scan history"><span class="muted">…</span></a>
    <span class="muted text-xs whitespace-nowrap">Replicant {{.Version}}</span>
  </div>
</footer>
</body>
</html>{{end}}
